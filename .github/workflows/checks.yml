name: Validate analysis code
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python src/make_demo.py
      - run: python src/run_analysis.py --data data/synthetic_demo.csv --config configs/demo.json --output outputs/demo
